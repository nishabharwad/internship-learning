<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>age calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">

    <h1>Age calculator</h1>
    <form>
        <label for="username">username :</label> 
        <input type="text" id="username" placeholder="enter your username" required>
        <br><br>
        <label for="fullname">full name :</label>
        <input type="text" id="fullname" placeholder="enter your full name" required>
        <br><br>
        <label for="birthyear">birth year :</label>
        <input type="number" id="birthyear" placeholder="YYYY" required>
        <br><br>
        <button type="button" onclick="calculateAge()">calculate age</button>
    </form>
    </div>
    <p id="result"></p>
    
    <script>
        let user;
        let name;
        let year;

        function calculateAge() {

            let username = document.getElementById("username").value;
            let fullname = document.getElementById("fullname").value;
            let birthyear = document.getElementById("birthyear").value;
            
            if (!username || !fullname || !birthyear ) 
            {
                alert("please fill in all fields ! ");
                return;
            }
            
            const alpha=/^[A-Za-z ]+$/

            if(!username.match(alpha) || !fullname.match(alpha))
            {
                alert("username or full name should only include letters")
                return;
            }
            
            user=username;
            name=fullname;
            year = Number(birthyear);
            const currentYear = new Date().getFullYear();
            let age = currentYear - year;

            if(isNaN(year) || age < 0 || age > 120)
            {
                alert("enter a valid year");
                return;
            }

            let ageCategory;
            
            if (age < 13) 
            {
                ageCategory = "Child";
            } 
            else if (age < 20) 
            {
                ageCategory = "Teenager";
            } 
            else if (age < 65) {
                ageCategory = "Adult";
            } 
            else {
                ageCategory = "Senior Citizen";
            }
        
            document.getElementById("result").innerHTML=`<strong> Your Details </strong> <br><br>
            <strong> Username : </strong> ${user} <br> 
            <strong> Name : </strong> ${name} <br> 
            <strong> Age : </strong> ${age} years <br> 
            <strong> Age Category : </strong> ${ageCategory}` ;

            document.getElementById("username").value = "";
            document.getElementById("fullname").value = "";
            document.getElementById("birthyear").value = "";
        }
   
   </script>
</body>
</html>
