<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reverse a string</title>
</head>
<body>
    <p id="rs"></p>
    <p id="newrs"></p>
    <script>
        const str= (strval) => strval.split("").reverse().join("");
        document.getElementById("rs").textContent=str("javascript");

        const newstr="hello world !";
        const newrevstr=newstr.split("").reverse().join("");
        document.getElementById("newrs").innerHTML=`original string= ${newstr} <br> reversed string= ${newrevstr}`;

    </script>
    
</body>
</html>
