<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
   
</head>
<body>
    
    
    <form id="entry">
        <h1>Expense Tracker</h1>
        <div class="fields">
            <label for="title">Expense Title : </label>
            <input type="text" id="title" placeholder="Enter an expense title">
        </div>
        <div class="fields">
            <label for="amount">Expense Amount : </label>
            <input type="number" step="any" id="amount" placeholder="Enter an expense amount">
        </div>
        <div class="fields">  
            <label for="category">Choose an expense category : </label>
            <select id="category" name="expensecategory">
                <option value="food">Food</option>
                <option value="travel">Travel</option>
                <option value="shopping">Shopping</option>
                <option value="bills">Bills</option>
                <option value="entertainment">Entertainment</option>
                <option value="health">Health</option>
            </select>
        </div>
        <div class="fields">
            <button type="submit" id="tracker">Add Expense</button>
            <p id="error"></p>
        </div>
    </form>

    <div id="expense-section">
        <h2>My Expenses</h2>
        <table id="expense-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Amount (₹)</th>
                    <th>Remove</th>
                </tr>
            </thead>
            <tbody id="expense-body">
                
            </tbody>
            <tfoot>
                <tr class="total-row">
                    <td colspan="3" id="total">Total :</td>
                    <td colspan="2" id="total-amount">₹0.00</td>
                </tr>
            </tfoot>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
