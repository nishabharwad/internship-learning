<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="display"></p>
    <script>
        const sequence= [1,2,3,4,5,7,8,9,10];
        let missing=[];
        for (i=1;i<=sequence.at(-1); i ++)
    {
        if (!sequence.includes(i)) missing=i;
    }
    document.getElementById("display").textContent=`missing number from the sequence = ${missing}`;
    </script>
</body>
</html>
