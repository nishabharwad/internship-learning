<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>find largest number from an array</title>
</head>
<body>
        <p id="ln"></p>
    <script>
        const arr=[10,20,30,40,50];
        document.getElementById("ln").textContent="here's the largest number :" + arr.reduce((largest, current) => { 
            if (current>largest)
        {
            return current;
        }
            else
        {
            return largest;
        }
        } , 0 );

    </script>

</body>
</html>
