<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>find largest number from an array</title>
</head>
<body>
    <p id="largestnumber"></p>
    <script>
        const arr=[0,-20,-30,-40,-50];
        const largestnum=Math.max(...arr);
        document.getElementById("largestnumber").textContent=`largest number : ${largestnum}`;
    </script>

</body>
</html>
