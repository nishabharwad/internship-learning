<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mini E-Commerce Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 
  <header>Mini Store</header>
 
  
  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search products..."/>
 
    <select id="categoryFilter">
      <option value="all">All Categories</option>
      <option value="electronics">Electronics</option>
      <option value="jewelery">Jewelry</option>
      <option value="men's clothing">Men's Clothing</option>
      <option value="women's clothing">Women's Clothing</option>
    </select>
 
    <select id="sortSelect">
      <option value="default">Sort By</option>
      <option value="price-low-high">Price: Low to High</option>
      <option value="price-high-low">Price: High to Low</option>
      <option value="rating-high-low">Rating: High to Low</option>
    </select>
  </div>
 
  
  <div class="product-grid" id="productGrid">
    <p class="status-message">Loading products...</p>
  </div>
 
  <script>
    
    let allProducts = [];   
    let searchQuery = "";
    let selectedCategory = "all";
    let sortOption = "default";
 
    
    async function fetchProducts() {
      try {
        const response = await fetch("https://fakestoreapi.com/products");
        const data = await response.json();
        allProducts = data;
        renderProducts();
      } catch (error) {
        document.getElementById("productGrid").innerHTML =
          '<p class="status-message">Failed to load products. Please try again.</p>';
      }
    }
 

    function getFilteredProducts() {
      let result = [...allProducts];
 
      
      if (searchQuery.trim() !== "") {
        result = result.filter(product =>
          product.title.toLowerCase().includes(searchQuery.toLowerCase())
        );
      }
 
    
      if (selectedCategory !== "all") {
        result = result.filter(product =>
          product.category === selectedCategory
        );
      }
 
      
      if (sortOption === "price-low-high") {
        result.sort((a, b) => a.price - b.price);
      } else if (sortOption === "price-high-low") {
        result.sort((a, b) => b.price - a.price);
      } else if (sortOption === "rating-high-low") {
        result.sort((a, b) => b.rating.rate - a.rating.rate);
      }
 
      return result;
    }
 
    
    function renderProducts() {
      const grid = document.getElementById("productGrid");
      const products = getFilteredProducts();
 
      if (products.length === 0) {
        grid.innerHTML = '<p class="no-results">No products found.</p>';
        return;
      }
 
      grid.innerHTML = products.map(product => `
        <div class="product-card">
          <img src="${product.image}" alt="${product.title}" />
          <p class="name">${product.title}</p>
          <p class="category">${product.category}</p>
          <p class="price">$${product.price.toFixed(2)}</p>
          <p class="rating">⭐ ${product.rating.rate} (${product.rating.count} reviews)</p>
          <button>Add to Cart</button>
        </div>
      `).join("");
    }
 
    
    document.getElementById("searchInput").addEventListener("input", function () {
      searchQuery = this.value;
      renderProducts();
    });
 
    document.getElementById("categoryFilter").addEventListener("change", function () {
      selectedCategory = this.value;
      renderProducts();
    });
 
    document.getElementById("sortSelect").addEventListener("change", function () {
      sortOption = this.value;
      renderProducts();
    });
 
    fetchProducts();
  </script>
 
</body>
</html>
