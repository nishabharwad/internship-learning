<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="display"></p>
    <script>
        const a=new Set([1,2,3,4,5,10]);
        const b=new Set([4,5,6,7,8,10]);
        const common=a.intersection(b);
        document.getElementById("display").textContent=`common elements :` + [...common];
    </script>
</body>
</html>
